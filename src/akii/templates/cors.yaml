id: cors

title: Cross-Origin Resource Sharing

description: >
  Analyze Cross-Origin Resource Sharing (CORS) response headers
  to identify insecure or overly permissive configurations.

severity: medium

headers:
  - Access-Control-Allow-Origin
  - Access-Control-Allow-Credentials
  - Access-Control-Allow-Methods
  - Access-Control-Allow-Headers
  - Access-Control-Max-Age
  - Access-Control-Expose-Headers

recommendation: >
  Restrict allowed origins to trusted domains, avoid using
  wildcard origins with credentials, and expose only the
  headers required by the application.

references:
  - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
  - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Access-Control-Allow-Origin
  - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Origin_Resource_Sharing_Cheat_Sheet.html

owasp:
  - A05:2021 Security Misconfiguration

cwe:
  - CWE-942

tags:
  - cors
  - security-header
  - browser