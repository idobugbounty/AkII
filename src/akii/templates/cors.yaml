id: cors

title: Cross-Origin Resource Sharing

description: >
  Analyze Cross-Origin Resource Sharing (CORS) response headers
  to identify insecure or overly permissive configurations.

checks:
  - header: Access-Control-Allow-Origin
    rules:
      - value: "*"
        severity: high
        message: >
          Wildcard origin allows requests from any origin.

      - value: "null"
        severity: medium
        message: >
          The null origin should only be trusted when explicitly required.

  - header: Access-Control-Allow-Credentials
    rules:
      - value: "true"
        severity: info
        message: >
          Credentials are allowed. Verify that trusted origins are explicitly
          configured.

  - header: Access-Control-Allow-Methods
    rules: []

  - header: Access-Control-Allow-Headers
    rules: []

  - header: Access-Control-Max-Age
    rules: []

  - header: Access-Control-Expose-Headers
    rules: []

recommendation: >
  Restrict allowed origins to trusted domains, avoid using wildcard origins
  with credentials, and expose only the headers required by the application.

references:
  - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
  - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Access-Control-Allow-Origin
  - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Origin_Resource_Sharing_Cheat_Sheet.html

owasp:
  - A05:2021 Security Misconfiguration

cwe:
  - CWE-942

tags:
  - cors
  - security-header
  - browser